# Standalone configuration, not an overlay: docker compose -f compose.production.yaml up --build
# Loopback bindings require an independently secured TLS reverse proxy for remote access.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      TASKBRIDGE_ENV: production
      TASKBRIDGE_REQUIRE_AUTH: "true"
      TASKBRIDGE_DATABASE_URL: postgresql://taskbridge:${TASKBRIDGE_POSTGRES_PASSWORD:?Set a strong URL-safe password}@database:5432/taskbridge
      TASKBRIDGE_VIEWER_TOKEN_SHA256: ${TASKBRIDGE_VIEWER_TOKEN_SHA256:?Required viewer digest}
      TASKBRIDGE_OPERATOR_TOKEN_SHA256: ${TASKBRIDGE_OPERATOR_TOKEN_SHA256:?Required operator digest}
      TASKBRIDGE_ADMIN_TOKEN_SHA256: ${TASKBRIDGE_ADMIN_TOKEN_SHA256:?Required admin digest}
      TASKBRIDGE_MODEL_PROVIDER: deterministic
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
  workshop:
    build:
      context: web
    ports:
      - "127.0.0.1:3000:80"
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskbridge
      POSTGRES_USER: taskbridge
      POSTGRES_PASSWORD: ${TASKBRIDGE_POSTGRES_PASSWORD:?Set a strong URL-safe password}
    volumes:
      - taskbridge-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskbridge -d taskbridge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  taskbridge-production-data:
