[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbridge-ai"
version = "0.2.0"
description = "Evidence-bound workflow discovery, automation assessment, and pilot simulation."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=9.0.3,<10", "ruff>=0.6,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
taskbridge = "taskbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
